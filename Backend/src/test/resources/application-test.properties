spring.datasource.url=jdbc:h2:mem:dogalert;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.flyway.enabled=false

dogalert.jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
dogalert.jwt.expiration-minutes=60

# RNF-SEG-06. El perfil de pruebas baja el umbral a 3 para que la prueba de
# bloqueo no tenga que agotar cinco intentos. La ventana se deja en 15 minutos
# porque el reloj es inyectable y las pruebas la adelantan con un Clock propio.
dogalert.login.max-failed-attempts=3
dogalert.login.lockout-minutes=15
dogalert.login.sweep-interval-seconds=600

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=11MB
