spring.application.name=dogalert-api
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

server.port=${PORT:8080}
server.address=0.0.0.0

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Conexión a Cloud SQL con Socket Factory de Google
spring.datasource.url=jdbc:mysql:///dogalert?cloudSqlInstance=dogalert-server-26:northamerica-south1:dogalert-prod-db&socketFactory=com.google.cloud.sql.mysql.SocketFactory

spring.datasource.username=${DB_USERNAME:dogalert_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.enabled=true

dogalert.jwt.secret=${JWT_SECRET}
dogalert.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
# DOG-35. La tabla poligonos_creel es la fuente de verdad del limite; estas dos
# propiedades son el respaldo que se usa mientras la geometria oficial no llegue.
# Ver V1.2_README.md: el GeoJSON aprobado no se inventa ni se versiona aqui.
dogalert.creel.boundary-version=${CREEL_BOUNDARY_VERSION:creel-2026-01}
dogalert.creel.polygon=${CREEL_BOUNDARY_POLYGON:27.72,-107.68;27.72,-107.54;27.84,-107.54;27.84,-107.68}
dogalert.creel.cache-ttl-seconds=${CREEL_CACHE_TTL_SECONDS:3600}

# DOG-35. El trabajo diario de anonimizacion queda registrado pero apagado
# hasta que Jazmin revise la politica. Ver SDD 09_seuridad_privacidad.md 9.5.
dogalert.retention.enabled=${RETENTION_ENABLED:false}
dogalert.retention.anonymization-cron=${RETENTION_ANONYMIZATION_CRON:0 17 3 * * *}
dogalert.retention.inactivity-months=${RETENTION_INACTIVITY_MONTHS:12}
dogalert.retention.min-report-years=${RETENTION_MIN_REPORT_YEARS:5}

# RNF-SEG-06. Intentos de inicio de sesion permitidos por identidad dentro de
# una ventana deslizante. Al llenarse, el login responde 429 con Retry-After.
# El umbral lo fija el equipo: SDD 04_api_rest.md 4.9 dice que los valores se
# afinan con pruebas, asi que 5 y 15 son un punto de partida, no una especificacion.
dogalert.login.max-failed-attempts=${LOGIN_MAX_FAILED_ATTEMPTS:5}
dogalert.login.lockout-minutes=${LOGIN_LOCKOUT_MINUTES:15}
dogalert.login.sweep-interval-seconds=${LOGIN_SWEEP_INTERVAL_SECONDS:600}

spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=11MB
