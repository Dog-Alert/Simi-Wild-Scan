spring.application.name=dogalert-api

# ---------------------------------------------------------------------------
# MIGRACIONES · HOY SON MANUALES. NO ACTIVAR FLYWAY SIN ACUERDO DEL DBA.
# ---------------------------------------------------------------------------
# `spring.flyway.enabled=true` parece activo, pero hoy es un no-op y conviene
# saber por qué: Flyway solo inspecciona `classpath:db/migration`, y los scripts
# viven en `Backend/src/database/migrations/`, que NO es un directorio de
# recursos y por tanto no está en el classpath. Flyway no encuentra ningún
# script, no registra versiones y no aplica nada.
#
# El proceso real es manual: DBeaver o Cloud SQL Auth Proxy, en orden, con el
# servidor sin escrituras. Ver DATABASE.md, sección «Estado de las versiones».
#
# El riesgo NO es el estado actual, es activarlo de verdad por accidente. Si
# alguien mueve los scripts al classpath o fija `spring.flyway.locations` sin
# más, en el siguiente despliegue Flyway encuentra el esquema de
# `dogalert-prod-db` sin `flyway_schema_history` y, con `baseline-version=0`,
# haría baseline de un esquema ya poblado y ejecutaría V1.1..V1.6 encima.
#
# Pasos que el DBA debe confirmar antes de una activación real:
#   1. Renombrar `V1.0_crear_usuarios_y_roles.sql` al patrón
#      `V1.0__crear_usuarios_y_roles.sql`; hoy le falta el separador `__` y
#      Flyway ni siquiera lo reconoce como migración versionada.
#   2. Poner `baseline-version` IGUAL a la versión ya desplegada, no 0, para que
#      no intente reproducir lo que ya existe.
#   3. Solo entonces tiene sentido activar Flyway.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

server.port=${PORT:8080}
server.address=0.0.0.0

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Conexión a Cloud SQL con Socket Factory de Google
spring.datasource.url=jdbc:mysql:///dogalert?cloudSqlInstance=dogalert-server-26:northamerica-south1:dogalert-prod-db&socketFactory=com.google.cloud.sql.mysql.SocketFactory
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# `update` NO es una herramienta de migraciones: no versiona, no ordena y no
# revierte. Es lo que permite que Hibernate cree en arranque los índices que las
# entidades declaran con `@Index`, y de ahí que los objetos de DOG-35 estén
# declarados también en las entidades y no solo en SQL.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.enabled=true

dogalert.jwt.secret=${JWT_SECRET}
dogalert.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
dogalert.creel.boundary-version=${CREEL_BOUNDARY_VERSION:creel-2026-01}
dogalert.creel.polygon=${CREEL_BOUNDARY_POLYGON:27.72,-107.68;27.72,-107.54;27.84,-107.54;27.84,-107.68}