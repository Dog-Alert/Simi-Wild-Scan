spring.application.name=dogalert-api
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

server.port=${PORT:8080}
server.address=0.0.0.0

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Conexión a Cloud SQL con Socket Factory de Google
spring.datasource.url=jdbc:mysql:///dogalert?cloudSqlInstance=dogalert-server-26:northamerica-south1:dogalert-prod-db&socketFactory=com.google.cloud.sql.mysql.SocketFactory
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.enabled=true

dogalert.jwt.secret=${JWT_SECRET}
dogalert.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}